[package]
name = "porta"
version = "0.7.0"

[permissions]
allow = ["FS.read", "FS.write", "IO", "Env", "Time", "Net", "Abort", "Proc", "Fan", "Rand"]
# The only children: `sh` detaching the porta daemon (wasm_rt.wt_spawn_self; sh runs nothing
# but `porta`) and `kill` (process.kill in wasm_rt.wt_kill). Tool commands from MCP clients run
# in the native sandbox (wt_exec_sandboxed), outside the process family.
proc = ["sh", "kill"]
# The native sandbox is a package in this repository (sandbox/), so that another
# host can build it in; its native code is porta's own.
native = ["porta_sandbox"]

[dependencies]
porta_sandbox = { path = "sandbox" }

[native-deps]
wasmtime = "47.0.3"
wasmtime-wasi = { version = "47.0.3", features = ["p3"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "=0.56.0", default-features = false }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
toml = "0.8"
