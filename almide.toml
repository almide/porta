[package]
name = "porta"
version = "0.5.0"

[permissions]
allow = ["FS.read", "FS.write", "IO", "Env", "Time", "Net"]

[native-deps]
wasmtime = "42.0.1"
wasmtime-wasi = "42.0.1"
reqwest = { version = "0.12.28", features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "=0.56.0", default-features = false }
serde = { version = "1", features = ["derive"] }
libc = "0.2"

toml = "0.8"
