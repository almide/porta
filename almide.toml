[package]
name = "porta"
version = "0.6.16"

[permissions]
allow = ["FS.read", "FS.write", "IO", "Env", "Time", "Net"]

[native-deps]
wasmtime = "47.0.3"
wasmtime-wasi = { version = "47.0.3", features = ["p3"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "=0.56.0", default-features = false }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
regex = "1"

toml = "0.8"
# The credential broker (#37): TLS terminated for bound hosts with a CA made
# per run, and re-opened to the real server. ring, the provider reqwest's
# rustls already builds, so no second crypto library and no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
webpki-roots = "1"
