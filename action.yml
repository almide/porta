name: porta
description: Install porta, checked against its signature, with what it needs to confine commands on this runner.
author: almide
branding:
  icon: shield
  color: gray-dark

inputs:
  version:
    description: >
      The release to install, as its tag (v0.6.12). Empty installs the tag this
      action was used at (`uses: almide/porta@v0.6.12`), or the latest release
      when it was used at a branch.
    default: ""
  namespaces:
    description: >
      On a Linux runner that restricts unprivileged user namespaces through
      AppArmor (Ubuntu 23.10 and later, the hosted runners among them), load
      the profile Ubuntu documents for porta alone, so each command gets its
      own PID, mount and network namespace, and the protections that need
      one. Needs sudo.
    default: "true"
  why:
    description: Install strace, which `porta run --why` traces a Linux run with.
    default: "false"

outputs:
  path:
    description: The installed porta binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    # The installer checks the release's signature wherever cosign is on the
    # PATH, and PORTA_REQUIRE_SIGNATURE makes a missing one fatal.
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        INSTALL_DIR: ${{ runner.temp }}/porta-bin
      run: |
        tag="$VERSION"
        if [ -z "$tag" ] && [[ "$ACTION_REF" == v* ]]; then tag="$ACTION_REF"; fi
        PORTA_RELEASE_TAG="$tag" PORTA_REQUIRE_SIGNATURE=1 bash "$GITHUB_ACTION_PATH/scripts/install.sh" "$INSTALL_DIR"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "path=$INSTALL_DIR/porta" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux' && inputs.namespaces == 'true'
      shell: bash
      env:
        PORTA: ${{ steps.install.outputs.path }}
      run: |
        if "$PORTA" check | grep -qE '^ok +own PID, mount and network namespace'; then
          echo "this runner already gives porta its namespaces"
        elif command -v apparmor_parser >/dev/null; then
          sudo bash "$GITHUB_ACTION_PATH/scripts/apparmor-userns.sh" "$PORTA"
        else
          echo "::warning::this runner refuses unprivileged user namespaces and has no AppArmor to grant them; porta runs without them and says what that leaves open"
        fi
    - if: runner.os == 'Linux' && inputs.why == 'true'
      shell: bash
      run: command -v strace >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
    - shell: bash
      env:
        PORTA: ${{ steps.install.outputs.path }}
      run: |
        "$PORTA" --version
        "$PORTA" check
