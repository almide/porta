[package]
name = "porta-compute"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rhai = { version = "=1.26.0", default-features = false, features = ["std", "no_module", "no_time", "no_float", "decimal"] }
rust_decimal = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
