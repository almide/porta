name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach binaries to
        required: true

permissions:
  contents: write

jobs:
  build:
    # Apple silicon and both Linux architectures. Intel macOS is not here: the
    # `macos-13` runner sat queued for three hours without ever starting, and
    # the only way to publish for it anyway would be to cross-compile on Apple
    # silicon — where the integration suite below cannot run the binary it
    # produced. Shipping something no machine has executed is the one thing
    # this workflow exists to prevent, so an Intel Mac builds from source.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Almide
        run: bash scripts/install-almide.sh
      - name: Build
        run: .tools/almide/almide build src/main.almd -o target/porta
      # A binary nobody checked is worse than no binary: the same suite that
      # gates a commit gates a release, on the machine that produced the file.
      - name: Verify the binary that will ship
        run: python3 scripts/integration.py target/porta
      # 552MB unstripped on Linux, 33MB after. Debug symbols are not something
      # to ask somebody to download to run a command. Stripped after the suite
      # above has run, so what was tested and what ships differ only in symbols.
      - name: Strip
        run: |
          before=$(wc -c < target/porta)
          strip target/porta
          echo "$before -> $(wc -c < target/porta) bytes"
          ./target/porta --version
      - name: Package
        run: |
          mkdir -p "dist/porta-${{ matrix.target }}"
          cp target/porta README.md LICENSE "dist/porta-${{ matrix.target }}/"
          tar -czf "dist/porta-${{ matrix.target }}.tar.gz" -C dist "porta-${{ matrix.target }}"
          # Debian and Ubuntu get a .deb as well, whose postinst loads the
          # AppArmor profile porta's namespaces need on Ubuntu 23.10 and later.
          tag="${{ inputs.tag || github.ref_name }}"
          assets="porta-${{ matrix.target }}.tar.gz"
          case "${{ matrix.target }}" in
            linux-x86_64) deb_arch=amd64 ;;
            linux-aarch64) deb_arch=arm64 ;;
            *) deb_arch= ;;
          esac
          if [ -n "$deb_arch" ]; then
            bash scripts/build-deb.sh target/porta "${tag#v}" "$deb_arch" dist
            assets="$assets porta_${tag#v}_${deb_arch}.deb"
          fi
          # One space between hash and name, as install.sh reads the list.
          (cd dist && shasum -a 256 $assets) | sed 's|  | |' > "dist/porta-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: porta-${{ matrix.target }}
          path: |
            dist/porta-${{ matrix.target }}.*
            dist/porta_*.deb

  # Published as a prerelease first. A release that is "latest" is one the
  # install instructions hand to strangers, and until something has installed
  # it on every platform it claims, nobody knows whether it can be.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # id-token lets the job prove to Sigstore which workflow, repository and
    # tag it is; the certificate it gets back names them, and nothing else can
    # obtain one that does.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One checksum file covering every asset, so the installer needs a single
      # fetch to verify whichever archive it chose. Collected outside dist and
      # moved in: `cat *.sha256 > porta-checksums.sha256` in the same directory
      # makes the output match its own glob, and cat reads what it is writing.
      - name: Collect checksums
        run: |
          cat dist/*.sha256 > "$RUNNER_TEMP/porta-checksums.sha256"
          rm -f dist/*.sha256
          mv "$RUNNER_TEMP/porta-checksums.sha256" dist/
          cat dist/porta-checksums.sha256
          ls -l dist
      # The two actions that touch signing are pinned to a commit, not a tag:
      # a tag can be moved, and cosign-installer publishes no major-version tag
      # at all, which is what failed the first attempt at v0.6.7.
      # Keyless: no key to keep or leak. The bundle carries the signature, the
      # certificate naming this workflow at this tag, and the transparency-log
      # entry; install.sh checks it wherever cosign is installed.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/porta-checksums.sha256.sigstore.json dist/porta-checksums.sha256
      # SLSA build provenance for each archive: which workflow run built it,
      # from which commit. `gh attestation verify <archive> --repo almide/porta`
      # checks it.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/porta-checksums.sha256
            dist/porta-checksums.sha256.sigstore.json
          fail_on_unmatched_files: true

  # Install what was just published, on every platform it was published for,
  # and check it enforces. The build job tested the binary it made; this tests
  # the archive a stranger downloads, fetched over the network and unpacked by
  # the script the README tells them to run.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # With cosign present and the signature required, the install below fails
      # unless the checksums carry this workflow's signature.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install from the published release and check it enforces
        env:
          GH_TOKEN: ${{ github.token }}
          PORTA_REQUIRE_SIGNATURE: "1"
        run: bash scripts/verify_release.sh "${{ inputs.tag || github.ref_name }}"
      - name: Every archive carries build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern 'porta-*.tar.gz' --dir "$RUNNER_TEMP/provenance"
          gh release download "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern 'porta_*.deb' --dir "$RUNNER_TEMP/provenance"
          for archive in "$RUNNER_TEMP"/provenance/*.tar.gz "$RUNNER_TEMP"/provenance/*.deb; do
            gh attestation verify "$archive" --repo "${{ github.repository }}"
          done
      # The .deb on the runner it is for: installed as a user would, then the
      # namespaces it exists to give must be there, and removing it must take
      # the profile with it.
      - name: Install the .deb and check the namespaces
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arch=$(dpkg --print-architecture)
          gh release download "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern "porta_*_${arch}.deb" --dir "$RUNNER_TEMP/deb"
          (cd "$RUNNER_TEMP/deb" && gh release download "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern porta-checksums.sha256 \
            && [ "$(grep "_${arch}.deb" porta-checksums.sha256 | cut -d' ' -f1)" = "$(sha256sum porta_*_"${arch}".deb | cut -d' ' -f1)" ])
          sudo apt-get install -y "$RUNNER_TEMP"/deb/porta_*_"${arch}".deb
          /usr/bin/porta check | grep -E '^ok +own PID, mount and network namespace'
          /usr/bin/porta run /bin/sh -v "$RUNNER_TEMP" -- -c 'echo ok > "$0/written"' "$RUNNER_TEMP"
          sudo apt-get remove -y porta
          test ! -e /etc/apparmor.d/usr.bin.porta

  # Only now is it the release the install instructions point at.
  promote:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ inputs.tag || github.ref_name }}" \
            --repo "${{ github.repository }}" --prerelease=false --latest
          echo "::notice::${{ inputs.tag || github.ref_name }} installed and enforced on every published platform"
