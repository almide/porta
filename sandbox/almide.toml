# The native sandbox as a package: what confines a host command to its grants.
# porta is built on it, and another host (nautra) builds it in the same way.
[package]
name = "porta_sandbox"
version = "0.7.0"

[native-deps]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
regex = "1"
toml = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
# The credential broker (#37): TLS terminated for bound hosts with a CA made
# per run, and re-opened to the real server. ring, the provider reqwest's
# rustls already builds, so no second crypto library and no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
webpki-roots = "1"
